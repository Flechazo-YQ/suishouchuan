name: CommandV iPhone
on:
  push:
    branches: [main, codex/flechazo-yq]
    paths: ['apps/ios/**', 'scripts/ios-*.sh', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: commandv-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
      - name: Build and test on iPhone simulator
        run: bash scripts/ios-test.sh
      - name: Archive and upload
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP }}
          APPLE_PROFILE_SHARE: ${{ secrets.APPLE_PROFILE_SHARE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/ios-release.sh
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/ios-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios-tests.xcresult --output-path build/screenshots || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: commandv-ios-${{ github.run_number }}
          path: |
            build/*.log
            build/*.json
            build/screenshots
            build/export/*.ipa
          retention-days: 7
