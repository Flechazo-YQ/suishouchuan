name: CommandV iPhone
on:
  push:
    branches: [codex/flechazo-yq]
    paths: ['apps/ios/**', 'scripts/ios-*', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: commandv-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
      - name: Require successful tests for this commit
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" > "$RUNNER_TEMP/commandv-runs.json"
          python3 - <<'PY'
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/commandv-runs.json'))['workflow_runs']
          assert any(r['head_sha']==os.environ['GITHUB_SHA'] and r['event']=='push' and r['conclusion']=='success' for r in runs), 'This exact commit must pass the iPhone CI tests before upload'
          PY
      - name: Build and test on iPhone simulator
        if: github.event_name != 'workflow_dispatch' || !inputs.upload
        run: bash scripts/ios-test.sh
      - name: Archive and upload
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_APP: ${{ secrets.APPLE_PROFILE_APP }}
          APPLE_PROFILE_SHARE: ${{ secrets.APPLE_PROFILE_SHARE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/ios-release.sh
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/ios-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ios-tests.xcresult --output-path build/screenshots || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: commandv-ios-${{ github.run_number }}
          path: |
            build/*.log
            build/*.json
            build/screenshots
            build/export/*.ipa
          retention-days: 7
