name: CommandV
options:
  bundleIdPrefix: com.flechazoyq
  developmentLanguage: en
  deploymentTarget:
    iOS: '15.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 65635WN76L
    MARKETING_VERSION: '1.2'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Distribution
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  CommandV:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: CaptureShared
      - path: Localization
      - path: Shared
        excludes: [CommandV.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flechazoyq.commandv
        TARGETED_DEVICE_FAMILY: '1'
        PROVISIONING_PROFILE_SPECIFIER: CommandV AppStore
        CODE_SIGN_ENTITLEMENTS: Shared/CommandV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) COMMANDV_APP
    info:
      path: App/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: CommandC
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [imagebridge]
            CFBundleURLName: com.flechazoyq.commandv.pair
        CommandVKeychainGroup: $(AppIdentifierPrefix)com.flechazoyq.commandv
        NSCameraUsageDescription: Take photos and videos to send to your computer, and scan pairing QR codes.
        NSMicrophoneUsageDescription: Record sound for videos you send to your computer.
        NSScreenCaptureUsageDescription: Capture screenshots or short recordings after you allow screen access. Review them before sending to a paired computer.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [screen-capture]
        NSLocalNetworkUsageDescription: Find your paired computer on the same Wi-Fi and send photos and videos directly.
        NSBonjourServices: [_imagebridge._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: CommandVShare
      - target: CommandVCapture
  CommandVCapture:
    type: app-extension
    platform: iOS
    deploymentTarget: '27.0'
    sources:
      - path: CaptureWidget
      - path: CaptureShared
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flechazoyq.commandv.capture
        TARGETED_DEVICE_FAMILY: '1'
        PROVISIONING_PROFILE_SPECIFIER: CommandV Capture AppStore
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: CaptureWidget/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: CommandC
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CommandVShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Localization
      - path: Shared
        excludes: [CommandV.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flechazoyq.commandv.share
        TARGETED_DEVICE_FAMILY: '1'
        PROVISIONING_PROFILE_SPECIFIER: CommandV Share AppStore
        CODE_SIGN_ENTITLEMENTS: Shared/CommandV.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Share/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: CommandC
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        CommandVKeychainGroup: $(AppIdentifierPrefix)com.flechazoyq.commandv
        NSLocalNetworkUsageDescription: Send the items you select to your paired computer over the local network.
        NSBonjourServices: [_imagebridge._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1
  CommandVTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CommandV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ''
        PROVISIONING_PROFILE_SPECIFIER: ''
  CommandVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CommandV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ''
        PROVISIONING_PROFILE_SPECIFIER: ''
schemes:
  CommandV:
    build:
      targets:
        CommandV: all
    test:
      targets: [CommandVTests, CommandVUITests]
      gatherCoverageData: true
